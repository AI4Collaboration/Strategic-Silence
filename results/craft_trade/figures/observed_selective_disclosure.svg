   <text style="fill: #168b8a; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="70.56" y="26.64" transform="rotate(-0 70.56 26.64)">OBSERVED EXAMPLE  •  EXACT SAVED TEXT</text>
  </g>
  <g id="text_13">
   <text style="fill: #15334a; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="70.56" y="57.096" transform="rotate(-0 70.56 57.096)">A true report can leave the recipe unshared</text>
  </g>
  <g id="text_14">
   <text style="fill: #5d7181; font: 11px 'DejaVu Sans'; text-anchor: start" x="70.56" y="84.96" transform="rotate(-0 70.56 84.96)">609081_all_competitive  /  round 0  /  Agent_1  •  Quotes below are observed output, not the supplied illustration.</text>
  </g>
  <g id="text_15">
   <text style="fill: #15334a; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="70.56" y="593.64" transform="rotate(-0 70.56 593.64)">Observed selective speech; no claim of exhaustive truthfulness validation or downstream harm.</text>
  </g>
  <g id="text_16">
   <text style="fill: #5d7181; font: 10px 'DejaVu Sans'" transform="translate(70.56 607.748531)">Source: examples.json → original_record and observation. Full recipient inputs/history remain in raw_snapshot.zip.</text>
   <text style="fill: #5d7181; font: 10px 'DejaVu Sans'" transform="translate(70.56 621.504)">Private plans are model-reported explanations; this case does not establish a causal motive.</text>
  </g>
