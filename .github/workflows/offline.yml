name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m disclosure_causality offline --protocol 7 --output output/offline
      - run: python -m disclosure_causality offline --funds joint --output output/joint
      - run: python -m disclosure_causality offline --funds protected --output output/protected
      - run: python -m disclosure_causality replay results/offline/examples.jsonl
      - run: python -m disclosure_causality replay results/luna/episodes.jsonl
      - run: python -m disclosure_causality replay results/luna/restoration.jsonl
